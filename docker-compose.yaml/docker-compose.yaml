version: '3.8'

services:
  backend:
    build: ./backend
    container_name: movie-backend-container
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  frontend:
    build: ./frontend
    container_name: movie-frontend-container
    ports:
      - "3000:80"
    depends_on:
      - backend